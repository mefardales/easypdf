# Deploying the easypdf.surf site on Render (https://render.com)
#
# Render picks this file up when the repository is connected ("New > Blueprint")
# and creates a static site serving the site/ folder. The pages come already
# generated in the repository, so there is no build step.
#
# To regenerate them after changing the texts:
#     python tools/build_site.py
#
# Your own domain: in Render, Settings > Custom Domains, add easypdf.surf and
# www.easypdf.surf, then create at the domain provider the DNS records Render
# shows on that same screen (usually an A record for the bare domain and a
# CNAME for www). Render issues the HTTPS certificate on its own.

services:
  - type: web
    name: easypdf-surf
    runtime: static
    rootDir: .
    buildCommand: "echo 'The site is already generated in site/'"
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.html
        name: Cache-Control
        value: public, max-age=600
      # The browser tools: the libraries never change without changing name,
      # so they can be kept for a year; the worker must not be, or a new
      # version would never reach anyone.
      - path: /tools/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /sw.js
        name: Cache-Control
        value: no-cache

    routes:
      # /es (with no slash) leads to the Spanish version
      - type: redirect
        source: /es
        destination: /es/
