name: Publicar release

# Crea la etiqueta y la release de GitHub con los archivos que ya estan en
# build/. Ademas de dar una pagina de descargas ordenada, GitHub cuenta cuantas
# veces se baja cada archivo, y ese numero es el que muestra la web.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (sin la v)"
        type: string
        default: "1.2.1"

permissions:
  contents: write

jobs:
  publicar:
    name: Crear la release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # se publica siempre desde main
          fetch-depth: 0     # hace falta historia para el rebase del push

      - name: Comprobar que la version coincide con la del paquete
        run: |
          set -e
          declarada=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/easypdf/__init__.py)
          if [ "$declarada" != "${{ inputs.version }}" ]; then
            echo "La version pedida (${{ inputs.version }}) no coincide con la"
            echo "del paquete ($declarada). Actualiza src/easypdf/__init__.py"
            echo "antes de publicar, o la web enlazaria archivos que no existen."
            exit 1
          fi

      - name: Comprobar que estan los binarios
        run: |
          set -e
          ls -lh build/
          for patron in "build/EasyPDF-${{ inputs.version }}-Setup.exe" \
                        "build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip" \
                        "build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz"; do
            [ -f "$patron" ] || { echo "Falta $patron"; exit 1; }
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: easypdf.surf ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Novedades de la 1.2.1

            **Aviso de version nueva**
            - El programa comprueba al arrancar si hay una version mas nueva en
              easypdf.surf y ofrece ir a descargarla. No descarga ni instala
              nada por su cuenta, y se puede desactivar desde el menu Ayuda.
              Solo hace una peticion GET: no envia ningun dato.

            **La goma ahora tapa, no borra**
            - Pinta un trazo opaco encima del documento, como un corrector.
              Blanco por defecto, con un boton para elegir otro color.
            - Aviso: tapa lo que se ve, pero el texto sigue en la capa de texto
              del PDF y se puede seleccionar. No sirve para ocultar datos
              confidenciales.
            - Los botones de zoom vuelven a ampliar y reducir tambien con la
              goma activa. Su tamano se cambia con Ctrl+ / Ctrl- o con [ y ].

            **Tablas**
            - El texto ya no salta de sitio al terminar de escribir en una
              celda: el editor usaba otro margen y otra alineacion.
            - DEL vuelve a borrar la tabla despues de haber editado una celda.
            - Van mas rapidas: arrastrar una tabla de 20x6 pasa de 5,2 a 2,9 ms
              por fotograma.

            **Correcciones**
            - Las guias de alineacion se quedaban pintadas en la pagina al
              crear o cargar anotaciones, sin estar arrastrando nada.

            ## Descargas

            | Archivo | Para |
            |---|---|
            | `EasyPDF-${{ inputs.version }}-Setup.exe` | Windows 10 y 11 - instalador, sin permisos de administrador |
            | `EasyPDF-${{ inputs.version }}-windows-x64-portable.zip` | Windows - portable, no instala nada |
            | `EasyPDF-${{ inputs.version }}-linux-x64.tar.xz` | Linux 64 bits - portable |

            Tambien en **https://easypdf.surf**

            Los archivos `.sha256` sirven para comprobar que la descarga llego intacta.
          files: |
            build/EasyPDF-${{ inputs.version }}-Setup.exe
            build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip
            build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz
            build/*.sha256

      # La web enlaza los archivos de la release por su nombre, asi que se
      # regenera aqui: si no, easypdf.surf seguiria ofreciendo la version
      # anterior aunque esta ya este publicada.
      - name: Actualizar los enlaces de descarga de la web
        run: |
          set -e
          python tools/build_site.py
          if [ -n "$(git status --porcelain site/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "Web: enlaces de descarga de la ${{ inputs.version }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "La web ya enlazaba esta version, no hay nada que subir."
          fi
