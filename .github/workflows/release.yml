name: Publish release

# Creates the tag and the GitHub release from the files already in build/. As
# well as giving a tidy downloads page, GitHub counts how many times each file
# is downloaded, and that number is what the site shows.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the v)"
        type: string
        default: "1.6.2"

permissions:
  contents: write

jobs:
  publish:
    name: Create the release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # releases always come from main
          fetch-depth: 0     # the push rebase needs the history

      - name: Check the version matches the package
        run: |
          set -e
          declared=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/easypdf/__init__.py)
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "The version asked for (${{ inputs.version }}) does not match the"
            echo "package one ($declared). Update src/easypdf/__init__.py before"
            echo "publishing, or the site would link files that do not exist."
            exit 1
          fi

      - name: Check the binaries are there
        run: |
          set -e
          ls -lh build/
          for wanted in "build/EasyPDF-${{ inputs.version }}-Setup.exe" \
                        "build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip" \
                        "build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz"; do
            [ -f "$wanted" ] || { echo "$wanted is missing"; exit 1; }
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: easypdf.surf ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## What is new in ${{ inputs.version }}

            See the commit history for the full list of changes.

            ## Downloads

            | File | For |
            |---|---|
            | `EasyPDF-${{ inputs.version }}-Setup.exe` | Windows 10 and 11 - installer, no administrator rights needed |
            | `EasyPDF-${{ inputs.version }}-windows-x64-portable.zip` | Windows - portable, installs nothing |
            | `EasyPDF-${{ inputs.version }}-linux-x64.tar.xz` | Linux 64 bit - portable |

            Also at **https://easypdf.surf**

            The `.sha256` files let you check the download arrived intact.
          files: |
            build/EasyPDF-${{ inputs.version }}-Setup.exe
            build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip
            build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz
            build/*.sha256

      # The site links the release files by name, so it is regenerated here:
      # otherwise easypdf.surf would go on offering the previous version even
      # though this one is already published.
      - name: Update the download links on the site
        run: |
          set -e
          python tools/build_site.py
          if [ -n "$(git status --porcelain site/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "Site: download links for ${{ inputs.version }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "The site already linked this version, there is nothing to push."
          fi
