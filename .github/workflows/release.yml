name: Publicar release

# Crea la etiqueta y la release de GitHub con los archivos que ya estan en
# build/. Ademas de dar una pagina de descargas ordenada, GitHub cuenta cuantas
# veces se baja cada archivo, y ese numero es el que muestra la web.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (sin la v)"
        type: string
        default: "1.3.0"

permissions:
  contents: write

jobs:
  publicar:
    name: Crear la release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # se publica siempre desde main
          fetch-depth: 0     # hace falta historia para el rebase del push

      - name: Comprobar que la version coincide con la del paquete
        run: |
          set -e
          declarada=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/easypdf/__init__.py)
          if [ "$declarada" != "${{ inputs.version }}" ]; then
            echo "La version pedida (${{ inputs.version }}) no coincide con la"
            echo "del paquete ($declarada). Actualiza src/easypdf/__init__.py"
            echo "antes de publicar, o la web enlazaria archivos que no existen."
            exit 1
          fi

      - name: Comprobar que estan los binarios
        run: |
          set -e
          ls -lh build/
          for patron in "build/EasyPDF-${{ inputs.version }}-Setup.exe" \
                        "build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip" \
                        "build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz"; do
            [ -f "$patron" ] || { echo "Falta $patron"; exit 1; }
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: easypdf.surf ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Novedades de la 1.3.0

            **Panel lateral con tres pestanas**
            - **Marcadores**, como hasta ahora.
            - **Notas**: lista con la pagina y el texto de cada una, con la
              cuenta de pendientes en el titulo. Al pulsarla salta a ella, y
              se puede marcar como leida para que desaparezca de la lista.
            - **Plantillas**: arbol por tipo (documentos, membretes, cuadros,
              formularios) con botones para usarla encima del documento, crear
              uno nuevo con ella, guardar la actual y borrar.

            **Plantillas de serie**
            - Vienen cuatro listas para usar: membrete, carta, acta de reunion
              con su tabla de acuerdos, y cuadro de datos. Estan hechas con las
              mismas anotaciones que crearia el usuario, asi que se editan y se
              mueven como cualquier otra cosa.

            **Guias arrastrables desde las reglas**
            - Arrastra desde la regla de arriba y sale una guia horizontal;
              desde la lateral, vertical. Se mueven, y sacandolas de la pagina
              se borran. Las anotaciones se alinean con ellas.

            **Correcciones**
            - El texto de una celda de tabla se quedaba a la izquierda mientras
              se escribia, aunque la tabla fuera centrada.
            - Ctrl+ no cambiaba el tamano de la goma: el atajo estaba repetido
              y Qt lo daba por ambiguo. Ahora vale tambien Ctrl+= y [ ].
            - Doble clic en una nota abre su texto. Antes pulsarla no hacia
              nada y solo se veia al pasar el raton por encima.

            ## Descargas

            | Archivo | Para |
            |---|---|
            | `EasyPDF-${{ inputs.version }}-Setup.exe` | Windows 10 y 11 - instalador, sin permisos de administrador |
            | `EasyPDF-${{ inputs.version }}-windows-x64-portable.zip` | Windows - portable, no instala nada |
            | `EasyPDF-${{ inputs.version }}-linux-x64.tar.xz` | Linux 64 bits - portable |

            Tambien en **https://easypdf.surf**

            Los archivos `.sha256` sirven para comprobar que la descarga llego intacta.
          files: |
            build/EasyPDF-${{ inputs.version }}-Setup.exe
            build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip
            build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz
            build/*.sha256

      # La web enlaza los archivos de la release por su nombre, asi que se
      # regenera aqui: si no, easypdf.surf seguiria ofreciendo la version
      # anterior aunque esta ya este publicada.
      - name: Actualizar los enlaces de descarga de la web
        run: |
          set -e
          python tools/build_site.py
          if [ -n "$(git status --porcelain site/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "Web: enlaces de descarga de la ${{ inputs.version }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "La web ya enlazaba esta version, no hay nada que subir."
          fi
