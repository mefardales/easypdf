name: Publicar release

# Crea la etiqueta y la release de GitHub con los archivos que ya estan en
# build/. Ademas de dar una pagina de descargas ordenada, GitHub cuenta cuantas
# veces se baja cada archivo, y ese numero es el que muestra la web.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (sin la v)"
        type: string
        default: "1.5.2"

permissions:
  contents: write

jobs:
  publicar:
    name: Crear la release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # se publica siempre desde main
          fetch-depth: 0     # hace falta historia para el rebase del push

      - name: Comprobar que la version coincide con la del paquete
        run: |
          set -e
          declarada=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/easypdf/__init__.py)
          if [ "$declarada" != "${{ inputs.version }}" ]; then
            echo "La version pedida (${{ inputs.version }}) no coincide con la"
            echo "del paquete ($declarada). Actualiza src/easypdf/__init__.py"
            echo "antes de publicar, o la web enlazaria archivos que no existen."
            exit 1
          fi

      - name: Comprobar que estan los binarios
        run: |
          set -e
          ls -lh build/
          for patron in "build/EasyPDF-${{ inputs.version }}-Setup.exe" \
                        "build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip" \
                        "build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz"; do
            [ -f "$patron" ] || { echo "Falta $patron"; exit 1; }
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: easypdf.surf ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Novedades de la 1.5.2

            **DEL dejaba de funcionar despues de usar la goma**
            - Con una herramienta de dibujo activa el clic pinta en vez de
              seleccionar, asi que no habia nada que borrar y la accion estaba
              desactivada: la tecla ni se disparaba y no pasaba absolutamente
              nada. Ahora avisa en la barra de estado y dice como salir
              (Esc vuelve a Seleccionar). Igual con Ctrl+C y Ctrl+X.
            - En el menu de deshacer, una pasada de goma ponia "Anadir dibujo".
              Ahora pone "Borrar con la goma", que es lo que hizo el usuario.

            **El panel lateral se quedaba sin sitio**
            - Las miniaturas se llevaban la columna entera y al panel le
              quedaban 190 px: el arbol de plantillas ensenaba tres filas y el
              boton de guardar quedaba pegado al borde. Ahora la columna se
              reparte a medias en el primer arranque, y el panel no baja de
              300 px. Si ya lo habias movido, manda lo que dejaste guardado.

            **Piezas para montar formularios**
            - Pestana **Elementos** en el panel lateral, con catorce piezas ya
              hechas repartidas en cuatro grupos: campos (con raya, de tres
              rayas, de fecha, con recuadro), casillas (suelta, lista de
              cuatro, Si/No), firmas (linea de firma, dos firmas, lugar y
              fecha) y estructura (titulo con raya, separador, tabla con
              cabeceras, recuadro de notas).
            - Doble clic, o el boton Insertar, y la pieza cae centrada en la
              pagina que se este viendo, sin salirse del papel y ya
              seleccionada. Todo el grupo es un solo paso de deshacer.
            - Son anotaciones normales, asi que se editan y se mueven como
              cualquier otra cosa; y cuando la hoja esta lista, el boton
              **Guardar actual...** de la pestana Plantillas la deja guardada
              en la carpeta Templates para reutilizarla.
            - Los nombres y los textos salen en el idioma de la interfaz.

            **Ventana de informacion mas limpia**
            - La letra pequena de las bibliotecas y la garantia sale de la
              ventana principal y pasa a un boton **Licencias**. Sigue estando,
              porque PySide6 es LGPL y hay que avisar de que se usa, pero ya no
              estorba a quien solo quiere ver la version.

            ## Descargas

            | Archivo | Para |
            |---|---|
            | `EasyPDF-${{ inputs.version }}-Setup.exe` | Windows 10 y 11 - instalador, sin permisos de administrador |
            | `EasyPDF-${{ inputs.version }}-windows-x64-portable.zip` | Windows - portable, no instala nada |
            | `EasyPDF-${{ inputs.version }}-linux-x64.tar.xz` | Linux 64 bits - portable |

            Tambien en **https://easypdf.surf**

            Los archivos `.sha256` sirven para comprobar que la descarga llego intacta.
          files: |
            build/EasyPDF-${{ inputs.version }}-Setup.exe
            build/EasyPDF-${{ inputs.version }}-windows-x64-portable.zip
            build/EasyPDF-${{ inputs.version }}-linux-x64.tar.xz
            build/*.sha256

      # La web enlaza los archivos de la release por su nombre, asi que se
      # regenera aqui: si no, easypdf.surf seguiria ofreciendo la version
      # anterior aunque esta ya este publicada.
      - name: Actualizar los enlaces de descarga de la web
        run: |
          set -e
          python tools/build_site.py
          if [ -n "$(git status --porcelain site/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "Web: enlaces de descarga de la ${{ inputs.version }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "La web ya enlazaba esta version, no hay nada que subir."
          fi
