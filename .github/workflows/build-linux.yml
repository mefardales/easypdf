name: Compilar Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar_en_build:
        description: "Guardar el paquete en la carpeta build/ del repositorio"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: EasyPDF portable para Linux
    runs-on: ubuntu-22.04   # glibc antigua = compatible con mas distribuciones
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Leer la version
        id: version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/easypdf/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Bibliotecas de sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compilar y empaquetar
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash packaging/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPDF-linux
          path: build/*linux*
          if-no-files-found: error

      - name: Guardar el paquete en la rama principal
        if: github.event_name == 'workflow_dispatch' && inputs.publicar_en_build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build
          if git diff --cached --quiet; then
            echo "Sin cambios en build/"
            exit 0
          fi
          git commit -m "Compilado de Linux ${{ steps.version.outputs.version }} en build/

          Paquete portable generado por GitHub Actions en ubuntu-22.04
          (run ${{ github.run_id }})."
          for intento in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((intento * 5))
          done
          exit 1

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*linux*
          generate_release_notes: true
