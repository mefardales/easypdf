name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      store_in_build:
        description: "Store the installer and the portable version in the repository's build/ folder"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: EasyPDF.exe + installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/easypdf/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The PyInstaller wheel ships an already-compiled bootloader, identical
      # across every application built with PyInstaller. Antivirus vendors sign
      # against that binary because malware uses it too, and any legitimate
      # program inherits the detection. Building it here from source is the
      # remedy PyInstaller's own documentation recommends: the bootloader stops
      # matching those signatures. It is no substitute for signing the
      # executable, which is the real fix.
      - name: Build the PyInstaller bootloader from source
        run: |
          pip install --upgrade --force-reinstall --no-binary pyinstaller pyinstaller
          python -c "import PyInstaller, pathlib; print('bootloader:', pathlib.Path(PyInstaller.__file__).parent / 'bootloader')"

      - name: Build the icon
        run: python tools/make_icon.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Package with PyInstaller
        run: pyinstaller packaging/easypdf.spec --noconfirm --clean --workpath .pyinstaller

      - name: Check the executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/EasyPDF/EasyPDF.exe")) { throw "The .exe was not built" }
          Get-Item "dist/EasyPDF/EasyPDF.exe" | Format-List Name, Length

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Prepare the build/ folder
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # Out with the binaries of other versions: build/ only holds what is
          # on offer now. Otherwise they pile up and end up sneaking into the
          # release, because the publish workflow uploads all of build/*.sha256.
          Get-ChildItem build -File |
            Where-Object { $_.Name -like "EasyPDF-*" -and $_.Name -notlike "EasyPDF-$env:VERSION-*" } |
            ForEach-Object { Write-Host "Removing $($_.Name)"; Remove-Item $_.FullName -Force }
          Copy-Item dist/installer/*.exe build/ -Force
          $zip = "build/EasyPDF-$env:VERSION-windows-x64-portable.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/EasyPDF/* -DestinationPath $zip
          Get-ChildItem build | ForEach-Object {
            if ($_.Extension -in ".exe", ".zip") {
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name |
                Out-File "$($_.FullName).sha256" -Encoding ascii
            }
          }
          Get-ChildItem build | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPDF-windows
          path: build/*
          if-no-files-found: error

      - name: Store the binaries on the main branch
        if: github.event_name == 'workflow_dispatch' && inputs.store_in_build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build
          if git diff --cached --quiet; then
            echo "No changes in build/"
            exit 0
          fi
          git commit -m "Add the Windows ${{ steps.version.outputs.version }} builds to build/

          Installer and portable version produced by GitHub Actions on
          windows-latest (run ${{ github.run_id }})."
          # The icon is regenerated on every build: those stray changes are
          # discarded or the rebase refuses to carry on.
          git restore --worktree . || git checkout -- .
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
          generate_release_notes: true
