name: Compilar Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: EasyPDF.exe + instalador
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generar el icono
        run: python tools/make_icon.py

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Empaquetar con PyInstaller
        run: pyinstaller packaging/easypdf.spec --noconfirm --clean

      - name: Comprobar que el ejecutable arranca
        run: |
          if (-not (Test-Path "dist/EasyPDF/EasyPDF.exe")) { throw "No se genero el .exe" }
          Get-Item "dist/EasyPDF/EasyPDF.exe" | Format-List Name, Length

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Comprimir la version portable
        run: Compress-Archive -Path dist/EasyPDF/* -DestinationPath dist/EasyPDF-portable-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPDF-windows
          path: |
            dist/installer/*.exe
            dist/EasyPDF-portable-windows-x64.zip
          if-no-files-found: error

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/EasyPDF-portable-windows-x64.zip
          generate_release_notes: true
