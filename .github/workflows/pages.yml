name: Publicar la web

# Copia site/ a la rama gh-pages: un espejo de la web en github.io.
# La web oficial (easypdf.surf) se despliega en Render con render.yaml.
#
# Se usa una rama en vez de las acciones oficiales de Pages porque activar
# Pages por API necesita permisos de administrador que el token de Actions
# no tiene.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Actualizar la rama gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerar las paginas
        run: python tools/build_site.py

      - name: Copiar site/ a gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/web
          cp -r site /tmp/web
          touch /tmp/web/.nojekyll   # sin procesado Jekyll: es HTML plano

          git fetch origin gh-pages || true
          git checkout -B gh-pages "origin/gh-pages" 2>/dev/null || git checkout --orphan gh-pages
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -not -name .git -not -name . -exec rm -rf {} +
          cp -r /tmp/web/. .

          git add -A
          if git diff --cached --quiet; then
            echo "La web no ha cambiado"
            exit 0
          fi
          git commit -m "Actualizar la web desde ${GITHUB_SHA::7}"
          git push origin gh-pages
          echo "Espejo publicado en https://mefardales.github.io/easypdf/"
